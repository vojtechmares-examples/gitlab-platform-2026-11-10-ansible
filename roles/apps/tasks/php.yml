---
- name: Names for this application and environment
  ansible.builtin.set_fact:
    unit: "{{ app_name }}-{{ env_name }}"
    port: "{{ app.ports[env_name] }}"

- name: "SELinux: Apache may listen on {{ port }}"
  community.general.seport:
    ports: "{{ port }}"
    proto: tcp
    setype: http_port_t
    state: present

- name: "SELinux: the release directories are web content"
  community.general.sefcontext:
    target: "/srv/{{ app_name }}(/.*)?"
    setype: httpd_sys_content_t
    state: present
  register: fcontext

- name: Apply the file contexts
  ansible.builtin.command: "restorecon -R /srv/{{ app_name }}"
  when: fcontext is changed

- name: "{{ unit }}: Apache configuration (its own instance, so staging and production stop and start independently)"
  ansible.builtin.template:
    src: php-httpd.conf.j2
    dest: "/etc/examples/{{ unit }}-httpd.conf"
    owner: root
    group: root
    mode: "0644"
  register: config_changed

- name: "{{ unit }}: systemd unit"
  ansible.builtin.template:
    src: php-httpd.service.j2
    dest: "/etc/systemd/system/{{ unit }}.service"
    owner: root
    group: root
    mode: "0644"
  register: unit_changed

- name: Reload systemd when a unit file changed
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: unit_changed is changed

- name: "{{ unit }}: enabled at boot (the pipeline starts it with the first release)"
  ansible.builtin.systemd_service:
    name: "{{ unit }}"
    enabled: true

- name: "{{ unit }}: restart a running instance when its configuration changed (a stopped one is left to the pipeline)"
  ansible.builtin.shell: "systemctl is-active --quiet {{ unit }} && systemctl restart {{ unit }} || true"
  when: config_changed is changed or unit_changed is changed
