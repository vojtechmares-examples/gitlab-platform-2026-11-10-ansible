---
- name: Caddy repository (COPR @caddy/caddy for EPEL 10)
  ansible.builtin.get_url:
    url: https://copr.fedorainfracloud.org/coprs/g/caddy/caddy/repo/epel-10/group_caddy-caddy-epel-10.repo
    dest: /etc/yum.repos.d/group_caddy-caddy.repo
    mode: "0644"

- name: Caddy
  ansible.builtin.dnf:
    name: caddy
    state: present

- name: Directory of the maintenance page
  ansible.builtin.file:
    path: /srv/caddy/maintenance
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Maintenance page (static HTML, shown while an upstream is down)
  ansible.builtin.template:
    src: maintenance.html.j2
    dest: /srv/caddy/maintenance/maintenance.html
    owner: root
    group: root
    mode: "0644"

- name: Caddyfile (automatic HTTPS for every application and environment)
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: caddy
    mode: "0640"
    validate: /usr/bin/caddy validate --config %s --adapter caddyfile
  notify: reload caddy

- name: Caddy is enabled and running
  ansible.builtin.systemd_service:
    name: caddy
    enabled: true
    state: started
