---
# One server, two environments. "staging" and "production" are the same VM here, so both groups contain
# the same address; what differs is the variable target_env, which scopes the per-application resources
# (databases, units, directories) to one environment. In a real estate these would be different hosts.
#
# Connection details come from the environment, as in the pipeline (CI/CD variables DEPLOY_HOST and
# DEPLOY_SSH_PORT, set at instance level) and in a shell for a local run.
all:
  children:
    deploy_servers:
      children:
        staging:
          hosts:
            deploy-staging:
              ansible_host: "{{ lookup('ansible.builtin.env', 'DEPLOY_HOST') }}"
              ansible_port: "{{ lookup('ansible.builtin.env', 'DEPLOY_SSH_PORT') | default(6022, true) }}"
              target_env: staging
        production:
          hosts:
            deploy-production:
              ansible_host: "{{ lookup('ansible.builtin.env', 'DEPLOY_HOST') }}"
              ansible_port: "{{ lookup('ansible.builtin.env', 'DEPLOY_SSH_PORT') | default(6022, true) }}"
              target_env: production
